name: test
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    strategy:
      matrix:
        os:
          - 'ubuntu-22.04'
          - 'ubuntu-24.04'
        python_version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python_version }}"
      - name: Setup the linter
        run: make test-requirements
      - name: Run the linter
        run: make test-lint
